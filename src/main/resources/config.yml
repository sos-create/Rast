# Rast 1.0.0 — Paper 1.21.4
# Conservative server-side utilities. No forced chunk loading.

item-merge:
  enabled: true
  radius: 1.25
  interval-ticks: 40
  # Hard work limits for each processed chunk.
  max-comparisons-per-chunk: 1200
  max-entities-per-chunk: 4096
  max-items-per-chunk: 512
  # Rotating cursor spreads work over multiple passes.
  max-chunks-per-pass: 32
  # Worlds listed here are skipped.
  disabled-worlds: []

diagnostics:
  log-startup-summary: true
