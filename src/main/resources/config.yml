# Rast 1.0.0 — Paper 1.21.4
# Safe server-side utilities. Client graphics and game mechanics are not modified.

item-merge:
  enabled: true
  radius: 1.25
  interval-ticks: 40
  # Candidate comparisons are bounded separately for each processed chunk.
  max-comparisons-per-chunk: 1200
  # Process only this many already-loaded chunks per pass; cursor rotates through them.
  max-chunks-per-pass: 32
  # Worlds listed here are skipped.
  disabled-worlds: []

diagnostics:
  log-startup-summary: true
