# Rast — Paper 1.21.4
# Настройки ниже применяются ТОЛЬКО к клиентам, чей brand совпадает
# с одной из строк accepted-client-brands.

horizon-optimization:
  enabled: true
  accepted-client-brands:
    - "horizon"
  # Персональная дальность отправки и обработки чанков для Horizon-клиента.
  # Значения ограничиваются диапазоном 2..32.
  view-distance: 8
  send-view-distance: 8
  simulation-distance: 4
